name: tests

# Smoke suites plus the REAL-DATABASE concurrency test, run against both MySQL and
# MariaDB. The concurrency job is the one that matters for the cap/quota
# invariants: they are enforced by UNIQUE constraints, and only a real server with
# many simultaneous connections can demonstrate that.

on:
  push:
    branches: [ main ]
    # A commit that changes only prose cannot change a test result, and each run
    # of this file costs about eleven runner-minutes. Documentation rounds were a
    # steady share of the bill.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # NOT .gitignore either (V70-03). The clean-tree gate reads git status,
      # so .gitignore decides WHICH files that gate can see: adding a pattern
      # there hides a whole path from it. It is build-safety input now, exactly
      # as .distignore is.
      # NOT .distignore. It was on this list and should never have been: it is
      # not repository housekeeping, it is INPUT TO THE BUILD — bin/build-dist.sh
      # passes it to rsync as --exclude-from, twice. A change to it can drop a
      # required file from the ZIP, sweep a development file into it, or alter
      # what is kept out on purpose, and every one of those is exactly what the
      # distribution checks exist to catch (V67-03).
  pull_request:
  workflow_dispatch:

# One run per branch. A dispatch started while a push run is still going now
# cancels it instead of paying for both — they would be testing the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, gmp, mysqli
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      # A few smoke files exercise the real WebAuthn ceremony code, so the
      # bundled libraries have to be installed first.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run the smoke suite
        run: bash bin/run-tests.sh

  concurrency:
    name: real-DB concurrency (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    # RESULTS ARE NOT WRITTEN INTO THE CHECKOUT. They were, and the reproduction
    # step later in this same job builds a release ZIP — which now refuses a
    # working tree with untracked files in it, correctly: the staging rsync
    # copies the repository root, so anything sitting there can end up in the
    # package (V69-01).
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mysql-8.0
            image: mysql:8.0
          - name: mysql-8.4
            image: mysql:8.4
          - name: mariadb-10.11
            image: mariadb:10.11
          - name: mariadb-11.4
            image: mariadb:11.4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none

      - name: Cache Composer downloads
        if: ${{ matrix.db.name == 'mysql-8.0' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      # Started with `docker run` rather than as a `services:` container so we can
      # pass SERVER flags: --max-connections for the 100 workers, and
      # --innodb-use-native-aio=0 because MariaDB's io_uring probe is blocked on
      # the runners (it aborts container start).
      - name: Start ${{ matrix.db.image }}
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=rootpw -e MYSQL_DATABASE=rapls_test \
            -e MARIADB_ROOT_PASSWORD=rootpw -e MARIADB_DATABASE=rapls_test \
            ${{ matrix.db.image }} \
            --max-connections=300 --innodb-use-native-aio=0
          # Probe from the host with the same driver the test uses: image-agnostic
          # (MariaDB 11.x ships no `mysqladmin`) and it proves the port is reachable.
          php -r 'mysqli_report(MYSQLI_REPORT_OFF);
            for ($i = 1; $i <= 60; $i++) {
              $c = @new mysqli("127.0.0.1", "root", "rootpw", "rapls_test", 3306);
              if (!$c->connect_errno) { echo "database is up after {$i} attempt(s)\n"; exit(0); }
              sleep(2);
            }
            fwrite(STDERR, "database did not become ready\n"); exit(1);' \
            || { docker logs db; exit 1; }

      # RESULTS is set here rather than in a job-level env: the runner context
      # is not available there, and a workflow that will not parse runs nothing at
      # all — which is how this was found.
      - name: Somewhere to put the results
        run: |
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Server identity
        run: |
          php -r 'mysqli_report(MYSQLI_REPORT_OFF);   // do not throw on MariaDB
            $c = new mysqli("127.0.0.1", "root", "rootpw", "rapls_test", 3306);
            printf("server=%s\n", $c->server_info);
            foreach (["@@version_comment", "@@server_uuid", "@@max_connections"] as $v) {
              $r = $c->query("SELECT {$v}");           // server_uuid is MySQL-only
              printf("%s=%s\n", $v, $r ? $r->fetch_row()[0] : "n/a");
            }'

      # 100 simultaneous workers, each on its own connection, released together by a
      # barrier. Asserts: cap=1 -> at most 1 row; cap=3 -> at most 3; quota cap=5 ->
      # at most 5; admission at max-1 -> at most 1 of 20 proceeds; at max -> 0 of 20;
      # a replayed write after reconnect stores exactly one row.
      - name: Concurrency test (100 workers)
        run: |
          php tests/db/concurrency.php \
            --host=127.0.0.1 --port=3306 --db=rapls_test --user=root --pass=rootpw \
            --workers=100 --json="$RESULTS/concurrency-${{ matrix.db.name }}.json"

      # The quota reservation must not depend on affected-row counts, so it has to
      # behave identically with MYSQLI_CLIENT_FOUND_ROWS on the connection.
      - name: Concurrency test with CLIENT_FOUND_ROWS
        env:
          RAPLS_CLIENT_FOUND_ROWS: '1'
        run: |
          php tests/db/concurrency.php \
            --host=127.0.0.1 --port=3306 --db=rapls_test --user=root --pass=rootpw \
            --workers=100 --json="$RESULTS/concurrency-${{ matrix.db.name }}-foundrows.json"

      # The same scenarios through the SHIPPED plugin classes (Schema migration,
      # CredentialRepository, RateLimit) rather than stand-alone SQL: migration
      # from the previous schema, the cap refusing when its unique index is gone,
      # fail-closed on a database error, and an idempotent replay.
      - name: Plugin integration test
        run: |
          php tests/db/integration.php \
            --host=127.0.0.1 --port=3306 --db=rapls_test --user=root --pass=rootpw \
            --workers=20 --json="$RESULTS/integration-${{ matrix.db.name }}.json"

      - name: Plugin integration test with CLIENT_FOUND_ROWS
        env:
          RAPLS_CLIENT_FOUND_ROWS: '1'
        run: |
          php tests/db/integration.php \
            --host=127.0.0.1 --port=3306 --db=rapls_test --user=root --pass=rootpw \
            --workers=20 --json="$RESULTS/integration-${{ matrix.db.name }}-foundrows.json"

      # Run the very procedure the reviewer's bundle documents: build the two
      # distribution ZIPs, then let verify.sh check their SHA-256, stage the
      # source, and run every suite. This proves the reproduction instructions
      # work, rather than asserting that they do.
      # Pro lives in a separate private repository. With RAPLS_PRO_REPO_TOKEN set
      # (a token that can read rapls/rapls-passkey-pro) the reproduction step below
      # covers BOTH plugins, exactly as the submitted bundle does. Without the
      # secret the step runs Free only and says so — it never silently claims more
      # than it ran.
      # ONCE, NOT FOUR TIMES. This step builds four distribution ZIPs and runs
      # both suites, and it did exactly the same work in all four database jobs —
      # the only thing the database changes is the concurrency and integration
      # runs above, which is what the matrix exists for. Doing it in one job
      # takes about six runner-minutes off every run.
      # WHICH Pro COMMIT (V80-02). This checks out a second repository, and
      # nothing recorded which revision of it arrived — so a bundle could say
      # "CI tested the repository head" and be unable to name the Pro head it
      # meant. RAPLS_PRO_REF pins it when a release wants a specific commit
      # tested; unset, it is that repository's default branch, and either way
      # the resolved SHA is written down in the step below.
      - name: Check out Pro (needs RAPLS_PRO_REPO_TOKEN)
        if: ${{ matrix.db.name == 'mysql-8.0' && env.PRO_TOKEN != '' }}
        env:
          PRO_TOKEN: ${{ secrets.RAPLS_PRO_REPO_TOKEN }}
        uses: actions/checkout@v4
        with:
          repository: rapls/rapls-passkey-pro
          token: ${{ secrets.RAPLS_PRO_REPO_TOKEN }}
          ref: ${{ vars.RAPLS_PRO_REF }}
          path: pro-src

      - name: Record which Pro commit this run tested
        if: ${{ matrix.db.name == 'mysql-8.0' }}
        run: |
          if [ -d pro-src ]; then
            echo "PRO_TESTED_SHA=$(git -C pro-src rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            echo "PRO_TESTED_SHA=" >> "$GITHUB_ENV"
          fi

      - name: Reproduction procedure (verify-bundle.sh) end to end
        if: ${{ matrix.db.name == 'mysql-8.0' }}
        run: |
          # OUT OF THE WORKING TREE FIRST. actions/checkout can only place a
          # second repository inside the workspace, and an untracked directory
          # there makes this one dirty — which build-dist.sh now refuses to
          # build from, correctly (V69-01). It has to move before anything is
          # built, not after the free plugin is done with.
          if [ -d pro-src ]; then mv pro-src ../rapls-passkey-pro; fi

          composer install --no-interaction --prefer-dist --no-progress
          curl -sSL -o bin/php-scoper.phar \
            https://github.com/humbug/php-scoper/releases/download/0.18.11/php-scoper.phar
          bash bin/build-dist.sh

          # One version, one artifact: building the same commit again must produce
          # the same bytes. If it does not, a release could exist twice under one
          # number, which is what this check exists to prevent.
          FIRST="$(shasum -a 256 ../rapls-passkey.zip | cut -d' ' -f1)"
          bash bin/build-dist.sh
          SECOND="$(shasum -a 256 ../rapls-passkey.zip | cut -d' ' -f1)"
          if [ "$FIRST" != "$SECOND" ]; then
            echo "NOT REPRODUCIBLE: $FIRST != $SECOND" >&2
            exit 1
          fi
          echo "reproducible build ok: $FIRST"

          PRO_ARGS=""
          if [ -d ../rapls-passkey-pro ]; then
            # Already moved out of the working tree above; built here, alongside
            # Free, the way both plugins are laid out on a real site.
            ( cd ../rapls-passkey-pro \
              && composer install --no-interaction --prefer-dist --no-progress \
              && cp ../rapls-passkey/bin/php-scoper.phar bin/php-scoper.phar \
              && bash bin/build-dist.sh )
            PRO_FIRST="$(shasum -a 256 ../rapls-passkey-pro.zip | cut -d' ' -f1)"
            ( cd ../rapls-passkey-pro && bash bin/build-dist.sh )
            PRO_SECOND="$(shasum -a 256 ../rapls-passkey-pro.zip | cut -d' ' -f1)"
            if [ "$PRO_FIRST" != "$PRO_SECOND" ]; then
              echo "NOT REPRODUCIBLE (pro): $PRO_FIRST != $PRO_SECOND" >&2
              exit 1
            fi
            echo "reproducible build ok (pro): $PRO_FIRST"
            PRO_ARGS="--pro ../rapls-passkey-pro.zip"
            echo "Pro included: running the full two-plugin procedure."
          else
            echo "NOTE: RAPLS_PRO_REPO_TOKEN is not set — this run covers the FREE plugin only."
          fi

          # shellcheck disable=SC2086
          bash tests/db/verify-bundle.sh --free ../rapls-passkey.zip $PRO_ARGS \
            --db-host 127.0.0.1 --db-port 3306 --db-name rapls_test \
            --db-user root --db-pass rootpw --workers 50

      # WHICH RUN PRODUCED THIS (V79-04). The result files said only whether the
      # scenarios passed, so a bundle could name a run and there was nothing in
      # the artifacts to agree or disagree with it — the provenance was an
      # assertion by whoever assembled the bundle. Each file now carries the run
      # that wrote it, and bin/make-bundle.sh reads the run id back out of them
      # rather than being told.
      - name: Stamp the results with the run that produced them
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RESULTS"/*.json; do
            php -r '
              $f = $argv[1];
              $d = json_decode((string) file_get_contents($f), true);
              if (!is_array($d)) { $d = array("unparsed" => true); }
              $d["ci"] = array(
                  "run_id"      => getenv("GITHUB_RUN_ID"),
                  "run_attempt" => getenv("GITHUB_RUN_ATTEMPT"),
                  "run_number"  => getenv("GITHUB_RUN_NUMBER"),
                  "repository"  => getenv("GITHUB_REPOSITORY"),
                  "sha"         => getenv("GITHUB_SHA"),
                  "workflow"    => getenv("GITHUB_WORKFLOW"),
                  "job"         => getenv("GITHUB_JOB"),
                  "matrix"      => basename($f, ".json"),
                  // The OTHER repository this run built and tested (V80-02).
                  // "" when this job did not check it out, which is a fact the
                  // bundle has to be able to see rather than infer.
                  "pro_sha"     => (string) getenv("PRO_TESTED_SHA"),
              );
              file_put_contents($f, json_encode($d, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
            ' "$f"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-${{ matrix.db.name }}
          path: |
            ${{ runner.temp }}/results/concurrency-*.json
            ${{ runner.temp }}/results/integration-*.json
